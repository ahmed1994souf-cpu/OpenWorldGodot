name: Build MotionBricks Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build MotionBricks for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:

      # =========================================================
      # 1. Checkout Godot project
      # =========================================================
      - name: Checkout Godot project
        uses: actions/checkout@v4


      # =========================================================
      # 2. Install build tools
      # =========================================================
      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            python3 \
            unzip


      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # 4. Android NDK
      # =========================================================
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Download Godot C++ bindings
      # =========================================================
      - name: Download godot-cpp
        run: |
          git clone \
            --depth 1 \
            --branch 10.0.0-stable \
            https://github.com/godotengine/godot-cpp.git \
            /tmp/godot-cpp


      # =========================================================
      # 6. Download MotionBricks source
      #
      # IMPORTANT:
      # Do NOT use the old FetchContent commit.
      # We clone the actual repository with its GGML submodule.
      # =========================================================
      - name: Download MotionBricks
        run: |
          git clone \
            --depth 1 \
            --recurse-submodules \
            https://github.com/localai-org/motion-bricks.cpp.git \
            /tmp/motion-bricks.cpp

          cd /tmp/motion-bricks.cpp

          echo "MotionBricks revision:"
          git rev-parse HEAD

          echo ""
          echo "GGML revision:"
          git -C ggml rev-parse HEAD


      # =========================================================
      # 7. Create Godot GDExtension source
      # =========================================================
      - name: Create Godot MotionBricks bridge
        shell: bash
        run: |
          set -e

          mkdir -p native/motion_bricks
          mkdir -p addons/motion_bricks/bin/android.release.arm64


          cat > native/motion_bricks/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)

          project(
              motion_bricks_godot
              LANGUAGES C CXX
          )

          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)


          # -----------------------------------------------------
          # Godot C++
          # -----------------------------------------------------

          add_subdirectory(
              /tmp/godot-cpp
              ${CMAKE_BINARY_DIR}/godot-cpp
              EXCLUDE_FROM_ALL
          )


          # -----------------------------------------------------
          # Official MotionBricks source
          # -----------------------------------------------------

          set(
              MOTIONBRICKS_BUILD_TESTS
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              MOTIONBRICKS_ENABLE_GGML
              ON
              CACHE BOOL ""
              FORCE
          )

          set(
              MOTIONBRICKS_ENABLE_LLAMAFILE
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              MOTIONBRICKS_ENABLE_VULKAN
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              MOTIONBRICKS_ENABLE_PHYSICS
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              MOTIONBRICKS_ENABLE_FUZZERS
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              MOTIONBRICKS_DOWNLOAD_MODELS
              OFF
              CACHE BOOL ""
              FORCE
          )

          # Android ARM64:
          # keep one generic CPU backend instead of building
          # desktop-specific CPU variants.
          set(
              MOTIONBRICKS_CPU_ALL_VARIANTS
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              GGML_NATIVE
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              GGML_OPENMP
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              GGML_VULKAN
              OFF
              CACHE BOOL ""
              FORCE
          )

          set(
              GGML_LLAMAFILE
              OFF
              CACHE BOOL ""
              FORCE
          )

          add_subdirectory(
              /tmp/motion-bricks.cpp
              ${CMAKE_BINARY_DIR}/motion-bricks
              EXCLUDE_FROM_ALL
          )


          # -----------------------------------------------------
          # Godot extension
          # -----------------------------------------------------

          add_library(
              motion_bricks_godot
              SHARED
              motion_bricks_native.cpp
          )


          target_include_directories(
              motion_bricks_godot
              PRIVATE

              /tmp/godot-cpp/include
              ${CMAKE_BINARY_DIR}/godot-cpp/gen/include

              /tmp/motion-bricks.cpp/include
          )


          target_link_libraries(
              motion_bricks_godot
              PRIVATE

              godot-cpp
              motionbricks_static
          )


          target_compile_definitions(
              motion_bricks_godot
              PRIVATE

              MOTIONBRICKS_GODOT_EXTENSION
          )


          set_target_properties(
              motion_bricks_godot
              PROPERTIES

              PREFIX "lib"

              OUTPUT_NAME
              "motion_bricks_godot"

              CXX_VISIBILITY_PRESET
              hidden

              VISIBILITY_INLINES_HIDDEN
              ON
          )
          EOF


      # =========================================================
      # 8. Create native bridge
      # =========================================================
      - name: Create native bridge source
        shell: bash
        run: |
          cat > native/motion_bricks/motion_bricks_native.cpp <<'EOF'
          #include <godot_cpp/classes/object.hpp>
          #include <godot_cpp/core/class_db.hpp>
          #include <godot_cpp/godot.hpp>
          #include <godot_cpp/variant/dictionary.hpp>
          #include <godot_cpp/variant/packed_float32_array.hpp>
          #include <godot_cpp/variant/string.hpp>
          #include <godot_cpp/variant/vector3.hpp>
          #include <godot_cpp/variant/utility_functions.hpp>

          #include <motionbricks/motionbricks.h>

          using namespace godot;


          class MotionBricksNative : public Object {

              GDCLASS(MotionBricksNative, Object)

          private:

              mb_runtime_options *runtime_options = nullptr;
              mb_model *model = nullptr;
              mb_style *style = nullptr;
              mb_command *command = nullptr;
              mb_agent *agent = nullptr;
              mb_motion *motion = nullptr;

              bool configured = false;

              uint64_t seed = 1;


              static void _bind_methods() {

                  ClassDB::bind_method(
                      D_METHOD(
                          "configure",
                          "model_path",
                          "style_path",
                          "threads"
                      ),
                      &MotionBricksNative::configure
                  );


                  ClassDB::bind_method(
                      D_METHOD("reset"),
                      &MotionBricksNative::reset
                  );


                  ClassDB::bind_method(
                      D_METHOD(
                          "plan",
                          "move",
                          "facing"
                      ),
                      &MotionBricksNative::plan
                  );


                  ClassDB::bind_method(
                      D_METHOD(
                          "sample",
                          "frame"
                      ),
                      &MotionBricksNative::sample
                  );


                  ClassDB::bind_method(
                      D_METHOD("advance", "frames"),
                      &MotionBricksNative::advance
                  );


                  ClassDB::bind_method(
                      D_METHOD("is_configured"),
                      &MotionBricksNative::is_configured
                  );


                  ClassDB::bind_method(
                      D_METHOD("joint_count"),
                      &MotionBricksNative::joint_count
                  );
              }


              bool check(
                  mb_status status,
                  const char *operation
              ) {

                  if (status == MB_OK) {
                      return true;
                  }


                  UtilityFunctions::printerr(
                      String("MotionBricks error: ") +
                      String(operation) +
                      String(" -> ") +
                      String(mb_status_string(status))
                  );


                  return false;
              }


              void cleanup() {

                  if (motion) {
                      mb_motion_free(motion);
                      motion = nullptr;
                  }


                  if (agent) {
                      mb_agent_free(agent);
                      agent = nullptr;
                  }


                  if (command) {
                      mb_command_free(command);
                      command = nullptr;
                  }


                  if (style) {
                      mb_style_free(style);
                      style = nullptr;
                  }


                  if (model) {
                      mb_model_free(model);
                      model = nullptr;
                  }


                  if (runtime_options) {
                      mb_runtime_options_free(
                          runtime_options
                      );

                      runtime_options = nullptr;
                  }


                  configured = false;
              }


          public:

              ~MotionBricksNative() {
                  cleanup();
              }


              bool configure(
                  String model_path,
                  String style_path,
                  int threads
              ) {

                  cleanup();


                  char error[2048] = {};


                  if (!check(
                      mb_runtime_options_create(
                          &runtime_options,
                          error,
                          sizeof(error)
                      ),
                      "runtime_options_create"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_runtime_options_set_device(
                          runtime_options,
                          MB_DEVICE_CPU,
                          error,
                          sizeof(error)
                      ),
                      "set_device"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_runtime_options_set_threads(
                          runtime_options,
                          static_cast<uint32_t>(
                              MAX(1, threads)
                          ),
                          error,
                          sizeof(error)
                      ),
                      "set_threads"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_model_load(
                          model_path.utf8().get_data(),
                          runtime_options,
                          &model,
                          error,
                          sizeof(error)
                      ),
                      "model_load"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_style_load(
                          model,
                          style_path.utf8().get_data(),
                          &style,
                          error,
                          sizeof(error)
                      ),
                      "style_load"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_command_create(
                          &command,
                          error,
                          sizeof(error)
                      ),
                      "command_create"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_agent_create(
                          model,
                          &agent,
                          error,
                          sizeof(error)
                      ),
                      "agent_create"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_agent_reset(
                          agent,
                          style,
                          error,
                          sizeof(error)
                      ),
                      "agent_reset"
                  )) {
                      return false;
                  }


                  configured = true;

                  return true;
              }


              bool is_configured() const {
                  return configured;
              }


              int joint_count() const {

                  if (!model) {
                      return 0;
                  }


                  uint32_t count = 0;

                  char error[256] = {};


                  if (
                      mb_model_get_joint_count(
                          model,
                          &count,
                          error,
                          sizeof(error)
                      ) != MB_OK
                  ) {
                      return 0;
                  }


                  return static_cast<int>(count);
              }


              void reset() {

                  if (
                      !configured ||
                      !agent
                  ) {
                      return;
                  }


                  char error[256] = {};


                  mb_agent_reset(
                      agent,
                      style,
                      error,
                      sizeof(error)
                  );
              }


              bool plan(
                  Vector3 move,
                  Vector3 facing
              ) {

                  if (
                      !configured ||
                      !agent ||
                      !command
                  ) {
                      return false;
                  }


                  char error[1024] = {};


                  if (!check(
                      mb_command_set_movement_direction(
                          command,
                          move.x,
                          move.y,
                          move.z,
                          error,
                          sizeof(error)
                      ),
                      "movement"
                  )) {
                      return false;
                  }


                  if (!check(
                      mb_command_set_facing_direction(
                          command,
                          facing.x,
                          facing.y,
                          facing.z,
                          error,
                          sizeof(error)
                      ),
                      "facing"
                  )) {
                      return false;
                  }


                  mb_command_set_seed(
                      command,
                      seed++,
                      error,
                      sizeof(error)
                  );


                  if (motion) {
                      mb_motion_free(motion);
                      motion = nullptr;
                  }


                  if (!check(
                      mb_agent_plan(
                          agent,
                          command,
                          &motion,
                          error,
                          sizeof(error)
                      ),
                      "agent_plan"
                  )) {
                      return false;
                  }


                  return motion != nullptr;
              }


              Dictionary sample(
                  int frame
              ) {

                  Dictionary result;


                  if (
                      !configured ||
                      !motion
                  ) {
                      return result;
                  }


                  char error[1024] = {};


                  uint64_t frame_count = 0;
                  uint64_t joint_count_value = 0;

                  const float *roots = nullptr;
                  const float *rotations = nullptr;

                  uint64_t root_values = 0;
                  uint64_t rotation_values = 0;


                  if (
                      mb_motion_get_frame_count(
                          motion,
                          &frame_count,
                          error,
                          sizeof(error)
                      ) != MB_OK
                  ) {
                      return result;
                  }


                  if (
                      mb_motion_get_joint_count(
                          motion,
                          &joint_count_value,
                          error,
                          sizeof(error)
                      ) != MB_OK
                  ) {
                      return result;
                  }


                  if (
                      mb_motion_get_root_translations(
                          motion,
                          &roots,
                          &root_values,
                          error,
                          sizeof(error)
                      ) != MB_OK
                  ) {
                      return result;
                  }


                  if (
                      mb_motion_get_local_rotations_xyzw(
                          motion,
                          &rotations,
                          &rotation_values,
                          error,
                          sizeof(error)
                      ) != MB_OK
                  ) {
                      return result;
                  }


                  if (
                      frame_count == 0 ||
                      joint_count_value == 0 ||
                      rotations == nullptr
                  ) {
                      return result;
                  }


                  int f = CLAMP(
                      frame,
                      0,
                      static_cast<int>(frame_count - 1)
                  );


                  Vector3 root;

                  if (
                      roots != nullptr &&
                      root_values >=
                          static_cast<uint64_t>(
                              f * 3 + 3
                          )
                  ) {

                      root = Vector3(
                          roots[f * 3 + 0],
                          roots[f * 3 + 1],
                          roots[f * 3 + 2]
                      );
                  }


                  PackedFloat32Array pose;

                  const int total =
                      static_cast<int>(
                          joint_count_value * 4
                      );


                  pose.resize(total);


                  for (int i = 0; i < total; ++i) {

                      pose[i] =
                          rotations[
                              f *
                              static_cast<int>(
                                  joint_count_value * 4
                              ) +
                              i
                          ];
                  }


                  result["root"] = root;
                  result["rotations"] = pose;
                  result["frames"] =
                      static_cast<int>(frame_count);
                  result["joints"] =
                      static_cast<int>(joint_count_value);
                  result["frame"] = f;


                  return result;
              }


              void advance(
                  int frames
              ) {

                  if (
                      !configured ||
                      !agent ||
                      frames <= 0
                  ) {
                      return;
                  }


                  char error[256] = {};


                  mb_agent_advance(
                      agent,
                      static_cast<uint32_t>(frames),
                      error,
                      sizeof(error)
                  );
              }
          };


          void initialize_motion_bricks(
              ModuleInitializationLevel level
          ) {

              if (
                  level ==
                  MODULE_INITIALIZATION_LEVEL_SCENE
              ) {

                  ClassDB::register_class<
                      MotionBricksNative
                  >();
              }
          }


          void uninitialize_motion_bricks(
              ModuleInitializationLevel level
          ) {
          }


          extern "C" {


          GDExtensionBool GDE_EXPORT
          motion_bricks_godot_library_init(
              GDExtensionInterfaceGetProcAddress
                  get_proc_address,
              GDExtensionClassLibraryPtr library,
              GDExtensionInitialization *
                  initialization
          ) {

              GDExtensionBinding::InitObject
                  init_obj(
                      get_proc_address,
                      library,
                      initialization
                  );


              init_obj.register_initializer(
                  initialize_motion_bricks
              );


              init_obj.register_terminator(
                  uninitialize_motion_bricks
              );


              init_obj.set_minimum_library_initialization_level(
                  MODULE_INITIALIZATION_LEVEL_SCENE
              );


              return init_obj.init();
          }

          }
          EOF


      # =========================================================
      # 9. Create GDExtension descriptor
      # =========================================================
      - name: Create GDExtension descriptor
        shell: bash
        run: |
          cat > addons/motion_bricks/motion_bricks.gdextension <<'EOF'
          [configuration]

          entry_symbol = "motion_bricks_godot_library_init"
          compatibility_minimum = "4.7"


          [libraries]

          android.release.arm64 = "res://addons/motion_bricks/bin/android.release.arm64/libmotion_bricks_godot.so"
          EOF


      # =========================================================
      # 10. Configure CMake
      # =========================================================
      - name: Configure Android ARM64 build
        working-directory: native/motion_bricks
        run: |
          cmake \
            -S . \
            -B "$GITHUB_WORKSPACE/build/android-arm64" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON


      # =========================================================
      # 11. Build only the Godot extension
      # =========================================================
      - name: Build MotionBricks Godot extension
        run: |
          cmake \
            --build build/android-arm64 \
            --target motion_bricks_godot \
            --parallel 2


      # =========================================================
      # 12. Find native library
      # =========================================================
      - name: Verify native library
        run: |
          echo "Searching for Android library..."

          find build/android-arm64 \
            -type f \
            -name "libmotion_bricks_godot.so" \
            -print

          LIB="$(
            find build/android-arm64 \
              -type f \
              -name "libmotion_bricks_godot.so" \
              | head -n 1
          )"

          if [ -z "$LIB" ]; then
            echo "ERROR: libmotion_bricks_godot.so was not produced."
            exit 1
          fi

          echo "Library:"
          ls -lh "$LIB"


      # =========================================================
      # 13. Download official MotionBricks weights/styles
      # =========================================================
      - name: Download official MotionBricks runtime
        run: |
          python3 \
            /tmp/motion-bricks.cpp/scripts/download_gguf_weights.py \
            --output motion_bricks/generated


      # =========================================================
      # 14. Verify model
      # =========================================================
      - name: Verify MotionBricks model
        run: |
          test -d motion_bricks/generated/g1-f32
          test -d motion_bricks/generated/styles

          echo "MotionBricks model:"
          find motion_bricks/generated \
            -maxdepth 3 \
            -type f \
            -print


      # =========================================================
      # 15. Install native library
      # =========================================================
      - name: Install Android GDExtension
        run: |
          LIB="$(
            find build/android-arm64 \
              -type f \
              -name "libmotion_bricks_godot.so" \
              | head -n 1
          )"

          cp "$LIB" \
            addons/motion_bricks/bin/android.release.arm64/

          ls -lh \
            addons/motion_bricks/bin/android.release.arm64/


      # =========================================================
      # 16. Create runtime package
      # =========================================================
      - name: Package MotionBricks Android runtime
        run: |
          mkdir -p dist

          zip -r \
            dist/MotionBricks-Android-ARM64-runtime.zip \
            addons/motion_bricks \
            motion_bricks/generated

          ls -lh \
            dist/MotionBricks-Android-ARM64-runtime.zip


      # =========================================================
      # 17. Upload artifact
      # =========================================================
      - name: Upload MotionBricks Android runtime
        uses: actions/upload-artifact@v4
        with:
          name: MotionBricks-Android-ARM64-runtime
          path: dist/MotionBricks-Android-ARM64-runtime.zip
          if-no-files-found: error
          retention-days: 14
