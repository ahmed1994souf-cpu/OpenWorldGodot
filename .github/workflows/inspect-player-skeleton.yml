name: Inspect Player Skeleton

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check player model
        run: |
          set -e
          echo "Checking player model..."
          test -f assets/models/player.glb
          ls -lh assets/models/player.glb

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -e

          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Create skeleton inspector
        shell: bash
        run: |
          mkdir -p tools

          cat > tools/dump_player_skeleton.gd <<'EOF'
          extends SceneTree

          func _init() -> void:
              call_deferred("_inspect")

          func _inspect() -> void:
              var path := "res://assets/models/player.glb"

              var packed := load(path) as PackedScene

              if packed == null:
                  printerr("FAILED: Could not load " + path)
                  quit(1)
                  return

              var instance := packed.instantiate()
              root.add_child(instance)

              var skeleton := _find_skeleton(instance)

              if skeleton == null:
                  printerr("FAILED: No Skeleton3D found in " + path)
                  quit(2)
                  return

              var file := FileAccess.open(
                  "res://skeleton_report.txt",
                  FileAccess.WRITE
              )

              if file == null:
                  printerr("FAILED: Could not create skeleton_report.txt")
                  quit(3)
                  return

              print("=== PLAYER SKELETON ===")
              print("Skeleton path: ", skeleton.get_path())
              print("Bone count: ", skeleton.get_bone_count())

              file.store_line(
                  "Skeleton path: %s" % skeleton.get_path()
              )

              file.store_line(
                  "Bone count: %d" % skeleton.get_bone_count()
              )

              file.store_line("")
              file.store_line("index	name	parent")

              for i in range(skeleton.get_bone_count()):
                  var bone_name := skeleton.get_bone_name(i)
                  var parent := skeleton.get_bone_parent(i)

                  var line := "%d	%s	%d" % [
                      i,
                      bone_name,
                      parent
                  ]

                  print(line)
                  file.store_line(line)

              file.close()

              print("=== DONE ===")

              quit(0)

          func _find_skeleton(node: Node) -> Skeleton3D:
              if node is Skeleton3D:
                  return node as Skeleton3D

              for child in node.get_children():
                  var result := _find_skeleton(child)

                  if result != null:
                      return result

              return null
          EOF

      - name: Run skeleton inspection
        shell: bash
        run: |
          set -o pipefail

          godot \
            --headless \
            --path . \
            --script tools/dump_player_skeleton.gd \
            2>&1 | tee skeleton_console.log

      - name: Inspect MotionBricks joint API
        shell: bash
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/localai-org/motion-bricks.cpp.git \
            /tmp/motion-bricks

          {
            echo "=== MotionBricks header files ==="

            find /tmp/motion-bricks \
              -maxdepth 3 \
              -type f \
              \( -name '*.h' -o -name '*.hpp' \) \
              | sort

            echo
            echo "=== Joint-related API lines ==="

            grep -RniE \
              'joint.*name|name.*joint|joint.*string|get_joint' \
              /tmp/motion-bricks/include \
              /tmp/motion-bricks/src \
              2>/dev/null \
              | head -200 || true

          } | tee motionbricks_joint_api.txt

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-skeleton-inspection
          path: |
            skeleton_report.txt
            skeleton_console.log
            motionbricks_joint_api.txt
