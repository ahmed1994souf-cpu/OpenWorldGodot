name: Inspect Player Skeleton

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find character model files
        shell: bash
        run: |
          set +e

          echo "=== Repository files ==="
          find . -type f | sort | head -500

          echo
          echo "=== GLB files ==="
          find . -type f \( -iname "*.glb" -o -iname "*.gltf" \) -print

          echo
          echo "=== FBX files ==="
          find . -type f -iname "*.fbx" -print

          echo
          echo "=== TSCN files ==="
          find . -type f -iname "*.tscn" -print

          echo
          echo "=== Referenced player paths ==="
          grep -RniE "player\.glb|player\.gltf|player\.fbx|Skeleton3D" . \
            --exclude-dir=.git \
            2>/dev/null | head -200 || true

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -e

          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo install -m 0755 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Create model inspector
        shell: bash
        run: |
          mkdir -p tools

          cat > tools/find_skeletons.gd <<'EOF'
          extends SceneTree

          func _init() -> void:
              call_deferred("_inspect")

          func _inspect() -> void:
              print("=== SEARCHING FOR SKELETON3D ===")

              var models := _find_model_files("res://")

              print("Model files found: ", models.size())

              for path in models:
                  print("")
                  print("MODEL: ", path)

                  var packed := load(path) as PackedScene

                  if packed == null:
                      print("Could not load.")
                      continue

                  var instance := packed.instantiate()
                  root.add_child(instance)

                  var skeletons: Array[Skeleton3D] = []
                  _find_skeletons(instance, skeletons)

                  print("Skeleton count: ", skeletons.size())

                  for skeleton in skeletons:
                      print("Skeleton: ", skeleton.get_path())
                      print("Bones: ", skeleton.get_bone_count())

                      for i in range(skeleton.get_bone_count()):
                          print(
                              "  ",
                              i,
                              " ",
                              skeleton.get_bone_name(i),
                              " parent=",
                              skeleton.get_bone_parent(i)
                          )

                  instance.queue_free()

              print("")
              print("=== DONE ===")

              quit(0)

          func _find_model_files(path: String) -> Array[String]:
              var result: Array[String] = []

              var dir := DirAccess.open(path)

              if dir == null:
                  return result

              dir.list_dir_begin()

              while true:
                  var item := dir.get_next()

                  if item == "":
                      break

                  if item == "." or item == "..":
                      continue

                  var full_path := path.path_join(item)

                  if dir.current_is_dir():
                      if not item.begins_with("."):
                          result.append_array(
                              _find_model_files(full_path)
                          )
                  else:
                      var lower := item.to_lower()

                      if lower.ends_with(".glb") \
                      or lower.ends_with(".gltf") \
                      or lower.ends_with(".fbx"):
                          result.append(full_path)

              dir.list_dir_end()

              return result

          func _find_skeletons(
              node: Node,
              result: Array[Skeleton3D]
          ) -> void:
              if node is Skeleton3D:
                  result.append(node)

              for child in node.get_children():
                  _find_skeletons(child, result)
          EOF

      - name: Run Godot skeleton inspection
        shell: bash
        run: |
          set -o pipefail

          godot \
            --headless \
            --path . \
            --script tools/find_skeletons.gd \
            2>&1 | tee skeleton_console.log

      - name: Inspect MotionBricks joint API
        shell: bash
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/localai-org/motion-bricks.cpp.git \
            /tmp/motion-bricks

          {
            echo "=== MotionBricks headers ==="

            find /tmp/motion-bricks \
              -maxdepth 3 \
              -type f \
              \( -name "*.h" -o -name "*.hpp" \) \
              | sort

            echo
            echo "=== Joint-related API ==="

            grep -RniE \
              "joint.*name|name.*joint|joint.*string|get_joint" \
              /tmp/motion-bricks/include \
              /tmp/motion-bricks/src \
              2>/dev/null \
              | head -200 || true

          } | tee motionbricks_joint_api.txt

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-skeleton-inspection
          path: |
            skeleton_console.log
            motionbricks_joint_api.txt
