name: Test Jammo Body Slam

on:
  push:
    paths:
      - ".github/workflows/test-jammo-bodyslam.yml"
      - "Jammo_LowPoly.fbx"
      - "Motifect_martial_arts_v1_0.zip"
      - "wrestling_animation_test_fixed.gd"
      - "wrestling_animation_test_fixed.tscn"
  workflow_dispatch:

jobs:
  test-jammo-bodyslam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project and animation assets
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Extract only Body Slam FBX from Motifect pack
        shell: bash
        run: |
          set -eu
          test -s Jammo_LowPoly.fbx
          test -s Motifect_martial_arts_v1_0.zip
          unzip -t Motifect_martial_arts_v1_0.zip
          entry="$(unzip -Z1 Motifect_martial_arts_v1_0.zip | grep -i 'wrestling_body_slam\.fbx$' | head -n 1)"
          test -n "$entry"
          mkdir -p assets/animations/motifect
          unzip -p Motifect_martial_arts_v1_0.zip "$entry" > assets/animations/motifect/wrestling_body_slam.fbx
          test -s assets/animations/motifect/wrestling_body_slam.fbx
          echo "Extracted $entry"
          ls -lh assets/animations/motifect/wrestling_body_slam.fbx

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot executable
        shell: bash
        run: |
          set -eu
          echo "GODOT=${GODOT:-<unset>}"
          command -v godot
          godot --version

      - name: Import project and FBX assets with Godot
        run: godot --headless --path . --editor --import

      - name: Run isolated Jammo and Body Slam inspection
        run: godot --headless --path . wrestling_animation_test_fixed.tscn --quit-after 5
