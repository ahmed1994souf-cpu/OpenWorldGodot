name: Build MotionBricks Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip unzip

      - name: Install Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure native GDExtension
        working-directory: native/motion_bricks
        run: |
          cmake -S . -B "$GITHUB_WORKSPACE/build/android-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DGODOTCPP_API_VERSION=4.7 \
            -DMOTIONBRICKS_BUILD_TESTS=OFF \
            -DMOTIONBRICKS_ENABLE_VULKAN=OFF \
            -DMOTIONBRICKS_ENABLE_PHYSICS=OFF \
            -DMOTIONBRICKS_DOWNLOAD_MODELS=OFF

      - name: Build native library
        run: |
          cmake --build build/android-release --target motion_bricks_godot -j2

      - name: Download official MotionBricks runtime weights
        run: |
          git clone --depth 1 https://github.com/localai-org/motion-bricks.cpp.git /tmp/motion-bricks.cpp
          python3 /tmp/motion-bricks.cpp/scripts/download_gguf_weights.py --output motion_bricks/generated

      - name: Install library into Godot addon
        run: |
          mkdir -p addons/motion_bricks/bin/android.release.arm64
          LIB=$(find build/android-release -type f -name 'libmotion_bricks_godot.so' | head -n 1)
          test -n "$LIB"
          cp "$LIB" addons/motion_bricks/bin/android.release.arm64/
          test -s addons/motion_bricks/bin/android.release.arm64/libmotion_bricks_godot.so

      - name: Package Android runtime
        run: |
          mkdir -p dist
          zip -r dist/MotionBricks-Android-ARM64-runtime.zip \
            addons/motion_bricks/bin/android.release.arm64 \
            motion_bricks/generated

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionBricks-Android-ARM64-runtime
          path: dist/MotionBricks-Android-ARM64-runtime.zip
          retention-days: 14
